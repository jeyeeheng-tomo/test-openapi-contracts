name: Validate contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint specs
        run: npm run lint

      - name: Bundle specs (must resolve cleanly)
        run: npm run bundle

      - name: Upload bundled specs
        uses: actions/upload-artifact@v4
        with:
          name: bundled-specs
          path: dist/specs/

  codegen:
    # Generated code is produced by CI, not by hand. On a push to main this job
    # regenerates everything and commits the result back; on a PR it only proves
    # the generators still run cleanly against the contract.
    #
    # Deliberately ONE job for both languages: two jobs pushing to main would
    # race and one would lose to a non-fast-forward.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: codegen-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to push back; the default checkout is a detached SHA.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Both generators are Java tools.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Pinned, not `stable`: `dart format` output can change between SDK
      # releases, which would churn the committed diff on every bump.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Cache the Fabrikt jar
        uses: actions/cache@v4
        with:
          path: .fabrikt
          key: fabrikt-${{ hashFiles('codegen.json') }}

      - name: Cache the OpenAPI Generator jar
        uses: actions/cache@v4
        with:
          path: node_modules/@openapitools/openapi-generator-cli/versions
          key: openapi-generator-${{ hashFiles('codegen.json') }}

      - run: npm ci
      - run: npm run bundle
      - run: npm run generate

      - name: Analyze the generated Dart
        working-directory: generated/dart
        run: dart analyze

      - name: Commit the regenerated code
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- generated/
          # --staged, not `git diff`: newly generated files are untracked, and a
          # plain `git diff` is blind to those. That is what made the old
          # staleness check pass against an empty generated/ tree.
          if git diff --quiet --staged -- generated/; then
            echo "Generated code already matches the specs."
            exit 0
          fi
          git --no-pager diff --staged --stat -- generated/
          git commit -m "Regenerate contract code [skip ci]"
          # main may have moved while this job ran.
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"

  breaking-changes:
    # Informational: flags backwards-incompatible changes vs. the base branch.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # oasdiff is a Go binary from GitHub releases. It is NOT on npm: the
      # `oasdiff` npm package is a 0.0.1-security placeholder with no
      # executable, so `npx oasdiff` fails with "could not determine
      # executable to run" and takes the whole job down with it.
      - name: Install oasdiff
        env:
          OASDIFF_VERSION: 1.33.0
        run: |
          set -euo pipefail
          asset="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          mkdir -p /tmp/oasdiff && cd /tmp/oasdiff
          curl -sSLf -o "$asset" "$url/$asset"
          curl -sSLf -o checksums.txt "$url/checksums.txt"
          grep " $asset\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" oasdiff
          /tmp/oasdiff/oasdiff --version

      - name: Diff each spec against the base branch
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          # Materialise the WHOLE specs/ tree at the base commit. A spec may be
          # split across paths/ and components/ files, so reconstructing it one
          # file at a time leaves those relative $refs dangling.
          rm -rf /tmp/base && mkdir -p /tmp/base
          git archive "$base" specs | tar -x -C /tmp/base
          failed=0
          for spec in specs/*/openapi.yaml; do
            if [ ! -f "/tmp/base/$spec" ]; then
              echo "::notice file=$spec::new spec, nothing to diff"
              continue
            fi
            echo "::group::$spec"
            /tmp/oasdiff/oasdiff breaking "/tmp/base/$spec" "$spec" --fail-on ERR || failed=1
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::warning::Breaking changes detected. Bump the major version or add a new path, or get sign-off from both consumers and the owning team."
            exit 1
          fi
