# Components shared by every service spec. Reference them with a relative $ref:
#   $ref: '../shared/components.yaml#/components/schemas/Error'
openapi: 3.0.3
info:
  title: Shared components
  version: 1.0.0
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform-issued JWT access token.

  parameters:
    PageSize:
      name: page_size
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageToken:
      name: page_token
      in: query
      required: false
      description: Opaque cursor returned by a previous call as `next_page_token`.
      schema:
        type: string

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          example: resource_not_found
        message:
          type: string
          description: Human-readable explanation. Do not parse this.
          example: User 018f3b2c-... does not exist.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context for the error.

    Timestamps:
      type: object
      required: [created_at, updated_at]
      properties:
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_argument
            message: "'email' is not a valid email address."
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthenticated
            message: Access token is missing or expired.
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: resource_not_found
            message: No such resource.
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
