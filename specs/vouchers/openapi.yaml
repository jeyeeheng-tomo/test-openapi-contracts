openapi: 3.0.3
info:
  title: Vouchers API
  version: 1.0.0
  description: |
    Vouchers held by a member and the offers they redeem against. Owned by the
    Loyalty team.

    Contract changes go through a PR in this repo; the implementation follows the
    merged contract, not the other way around.
  contact:
    name: Loyalty team
    email: loyalty@example.com

servers:
  - url: https://api.example.com/vouchers/v1
    description: Production
  - url: https://api.staging.example.com/vouchers/v1
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Vouchers
    description: Browse the vouchers available to the caller.

paths:
  # One file per path item, under paths/. Refs there are relative to that file.
  /vouchers:
    $ref: './paths/vouchers.yaml'
  /vouchers/{voucherId}:
    $ref: './paths/vouchers-by-id.yaml'

components:
  securitySchemes:
    bearerAuth:
      $ref: '../shared/components.yaml#/components/securitySchemes/bearerAuth'

  # Vouchers-specific parameters and schemas live under components/. They are pulled
  # into the bundle by the paths/ files that reference them, and each bundled
  # component takes its name from the FILE NAME -- components/schemas/Voucher.yaml
  # becomes `Voucher`, which is the generated Kotlin/Dart class name. Do not also
  # alias them here: that emits a duplicate schema into the bundle.
