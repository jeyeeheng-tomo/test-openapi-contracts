openapi: 3.0.3
info:
  title: Users API
  version: 1.0.0
  description: |
    Identity and profile data. Owned by the Platform team.

    Contract changes go through a PR in this repo; the implementation follows the
    merged contract, not the other way around.
  contact:
    name: Platform team
    email: platform@example.com

servers:
  - url: https://api.example.com/users/v1
    description: Production
  - url: https://api.staging.example.com/users/v1
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Users
    description: Create and read user accounts.

paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      tags: [Users]
      parameters:
        - $ref: '../shared/components.yaml#/components/parameters/PageSize'
        - $ref: '../shared/components.yaml#/components/parameters/PageToken'
        - name: email
          in: query
          required: false
          description: Filter to the single user with this exact email address.
          schema:
            type: string
            format: email
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  next_page_token:
                    type: string
                    description: Pass as `page_token` to fetch the next page. Absent on the last page.
        '400':
          $ref: '../shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/Unauthorized'

    post:
      operationId: createUser
      summary: Create a user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: The created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '../shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/Unauthorized'
        '409':
          $ref: '../shared/components.yaml#/components/responses/Conflict'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUser
      summary: Get a user by id
      tags: [Users]
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '../shared/components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../shared/components.yaml#/components/responses/NotFound'

    patch:
      operationId: updateUser
      summary: Update a user
      description: Only the fields present in the request body are changed.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '../shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../shared/components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../shared/components.yaml#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      $ref: '../shared/components.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Opaque user identifier (UUID v7).
      schema:
        type: string
        format: uuid

  schemas:
    User:
      # Everything lives inside allOf: Fabrikt rejects `properties` and a
      # combiner at the same level. See CONTRIBUTING.md.
      allOf:
        - $ref: '../shared/components.yaml#/components/schemas/Timestamps'
        - type: object
          required: [id, email, display_name, status]
          properties:
            id:
              type: string
              format: uuid
              example: 018f3b2c-9b10-7c3a-9f2e-1a2b3c4d5e6f
            email:
              type: string
              format: email
              example: ada@example.com
            display_name:
              type: string
              maxLength: 120
              example: Ada Lovelace
            status:
              type: string
              enum: [active, suspended, deactivated]
              example: active

    CreateUserRequest:
      type: object
      required: [email, display_name]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 120
      additionalProperties: false

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [active, suspended, deactivated]
      additionalProperties: false
